name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Unit tests (no model downloads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package (with dev/test extras)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

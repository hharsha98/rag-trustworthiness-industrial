<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Trustworthiness — Instrument</title>
<meta name="description" content="Ask a question against a private corpus and watch every trust metric resolve: grounding, citation accuracy, relevance, redundancy, and a non-compensatory trust score.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090b;  --s1:#0e1013;  --s2:#14171c;  --s3:#1a1e25;
  --border:#1e232a;  --border-2:#2a313a;
  --text:#f2f4f7;  --text-2:#9aa4b2;  --text-3:#7f8a97; /* spec's #6b7480 clears ~4.0:1 on --s1; this clears ~4.8:1 */
  --accent:#4da3ff;  --accent-dim:rgba(77,163,255,.12);  --accent-ink:#031420;
  --ok:#34d399;  --warn:#fbbf24;  --bad:#f87171;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --t:150ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:400 15px/1.6 var(--font-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
::selection{background:var(--accent-dim);color:var(--text)}
.sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.skip-link{
  position:absolute;left:12px;top:-48px;z-index:100;background:var(--accent);color:var(--accent-ink);
  padding:10px 14px;border-radius:var(--r-sm);font:600 13px var(--font-ui);text-decoration:none;
  transition:top var(--t);
}
.skip-link:focus-visible{top:12px}

/* ============ top bar ============ */
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(14,16,19,.88);
  backdrop-filter:saturate(1.5) blur(10px);-webkit-backdrop-filter:saturate(1.5) blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{max-width:1280px;margin:0 auto;padding:10px 24px;min-height:56px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none;color:var(--text)}
.brand-mark{flex:none;display:block}
.brand-name{font-size:14px;font-weight:600;letter-spacing:-.01em}
.status-cluster{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:8px}
@media (max-width:480px){
  .status-cluster{margin-left:0;width:100%}
}
.chip{
  display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--font-ui);color:var(--text-2);
  border:1px solid var(--border);border-radius:999px;background:var(--s2);padding:7px 11px;
  white-space:nowrap;
}
.chip b{color:var(--text);font-weight:600}
.chip b.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.chip-toggle{
  cursor:pointer;font:500 12px var(--font-ui);
  transition:border-color var(--t),color var(--t),background var(--t);
}
.chip-toggle:hover{border-color:var(--border-2);color:var(--text)}
.chip-toggle[aria-expanded="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-dim)}
.chevron{font-size:10px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);display:inline-block;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.16)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.16)}

/* ============ workspace shell ============ */
.workspace{max-width:1280px;margin:0 auto;padding:28px 24px 80px;position:relative}

/* ============ composer ============ */
.composer{
  border:1px solid var(--border);border-radius:var(--r-lg);background:var(--s2);
  padding:20px 22px;box-shadow:0 24px 56px -34px rgba(0,0,0,.85);
}
.composer-tagline{margin:0 0 16px;color:var(--text-2);font-size:13px;max-width:60ch}
.composer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.corpus-row{margin-bottom:12px}
.ask-row{margin-top:14px;align-items:stretch}
/* Side by side, the input and the button split a 375px screen into two cramped
   halves and the question becomes unreadable while being typed -- the one thing
   this row exists for. Below 520px they stack and each gets the full width. */
@media (max-width:520px){
  .ask-row{flex-direction:column}
  .ask-row .ask-input{width:100%}
  .ask-row .btn-primary{width:100%;padding:13px 24px}
}

.select{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);font:400 13px var(--font-ui);padding:9px 12px;outline:none;cursor:pointer;
  transition:border-color var(--t);max-width:230px;
}
.select:hover{border-color:var(--border-2)}
.select:focus-visible{border-color:var(--accent)}

.dropzone{
  flex:1;min-width:170px;border:1px dashed var(--border-2);border-radius:var(--r-sm);
  color:var(--text-3);font-size:12.5px;padding:9px 14px;cursor:pointer;outline:none;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:border-color var(--t),color var(--t),background var(--t);
}
.dropzone:hover,.dropzone:focus-visible{border-color:var(--accent);color:var(--text-2)}
.dropzone.drag{border-color:var(--accent);color:var(--text);background:var(--accent-dim)}

.btn-ghost{
  font:500 12.5px var(--font-ui);color:var(--text-2);background:var(--s1);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 13px;cursor:pointer;
  transition:border-color var(--t),color var(--t);white-space:nowrap;
}
.btn-ghost:hover{border-color:var(--bad);color:var(--bad)}

.ask-input{
  flex:1;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font:400 15px/1.4 var(--font-ui);padding:14px 16px;outline:none;min-width:0;
  transition:border-color var(--t),box-shadow var(--t);
}
.ask-input::placeholder{color:var(--text-3)}
.ask-input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-dim)}

.btn-primary{
  border:0;border-radius:var(--r);padding:0 24px;cursor:pointer;white-space:nowrap;
  font:600 14px var(--font-ui);letter-spacing:.01em;background:var(--accent);color:var(--accent-ink);
  transition:filter var(--t),transform 60ms ease;
}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed;filter:none}

.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ex{
  font:400 12.5px var(--font-ui);color:var(--text-2);background:var(--s1);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;
  transition:border-color var(--t),color var(--t);text-align:left;
}
.ex:hover{border-color:var(--accent);color:var(--text)}
.ex[data-kind="out"]{border-style:dashed}

.confirm{color:var(--ok);font:13px var(--font-mono);padding:8px 2px 0}
.err{color:var(--bad);font:13px var(--font-mono);padding:8px 2px}

/* ============ scan (staged measurement sequence) ============ */
.scan{display:none;padding:22px 20px;text-align:center}
.scan.inline-scan{padding:14px 4px 4px}
.scan.show{display:block}
.scan .steps{display:flex;justify-content:center;gap:0;flex-wrap:wrap;margin-bottom:14px}
.scan .step{
  font:500 11px/1 var(--font-mono);letter-spacing:.03em;color:var(--text-3);padding:0 14px;position:relative;
  transition:color .3s;
}
.scan .step.done{color:var(--ok)}
.scan .step.active{color:var(--accent)}
.scan .step+.step::before{content:"";position:absolute;left:0;top:50%;width:1px;height:11px;background:var(--border);transform:translateY(-50%)}
.trace{height:2px;background:var(--s1);border-radius:2px;overflow:hidden;max-width:420px;margin:0 auto}
.trace i{display:block;height:100%;width:38%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.15s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(360%)}}

/* ============ results ============ */
.stage{margin-top:24px;display:none}
.stage.show{display:block;animation:rise .4s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.verdict{
  display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:var(--r-lg);
  border:1px solid var(--border);background:var(--s2);margin-bottom:18px;
}
.verdict .big{font:600 15px var(--font-ui)}
.verdict .sub{color:var(--text-2);font-size:13px;margin-top:3px}
.verdict.ok{border-color:rgba(52,211,153,.35);background:linear-gradient(90deg,rgba(52,211,153,.09),var(--s2) 65%)}
.verdict.no{border-color:rgba(248,113,113,.35);background:linear-gradient(90deg,rgba(248,113,113,.09),var(--s2) 65%)}
.verdict.abst{border-color:rgba(251,191,36,.35);background:linear-gradient(90deg,rgba(251,191,36,.09),var(--s2) 65%)}

.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:940px){.cols{grid-template-columns:1fr}}

.card{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--s2);padding:18px 20px}
.card h2{
  font:600 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin:0 0 14px;
}
.answer{font-size:15px;line-height:1.75;color:var(--text)}
.answer .cite{
  font:600 11px var(--font-mono);color:var(--accent);background:var(--accent-dim);
  border:1px solid rgba(77,163,255,.32);border-radius:4px;padding:1px 5px;margin:0 1px;
  cursor:pointer;transition:background var(--t);
}
.answer .cite:hover{background:rgba(77,163,255,.24)}

/* ---- trust gauge ---- */
.gauge{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.gauge svg{flex:none}
.gauge-ring{transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1)}
.gauge .legend{font-size:12.5px;color:var(--text-2);line-height:1.8;min-width:170px;flex:1}
.gauge .row{display:flex;align-items:center;gap:8px}
.gauge .swatch{width:10px;height:10px;border-radius:2px;flex:none}
.gauge .val{font:600 13px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--text);margin-left:auto;padding-left:14px}
.collapse-note{
  font-size:12.5px;color:var(--text-2);border-left:2px solid var(--border);padding-left:12px;margin-top:12px;line-height:1.6;
}
.collapse-note b{color:var(--warn);font-weight:600}

/* ---- metrics ---- */
.metric{margin:0 0 13px}
.metric .lab{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.metric .name{font-size:13px;color:var(--text)}
.metric .num{margin-left:auto;font:600 13px var(--font-mono);font-variant-numeric:tabular-nums}
.metric .track{height:6px;border-radius:3px;background:var(--s1);overflow:hidden;border:1px solid var(--border)}
.metric .fill{display:block;height:100%;border-radius:3px;width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
.metric .hint{font-size:11.5px;color:var(--text-3);margin-top:4px}
.na{color:var(--text-3);font-style:italic}

/* ---- tables / passages ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font:600 10.5px/1 var(--font-mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-3);padding:0 10px 9px;border-bottom:1px solid var(--border);
}
td{padding:11px 10px;border-bottom:1px solid rgba(30,35,42,.7);vertical-align:top;color:var(--text-2)}
td.n{text-align:right;font:600 13px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text)}
tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}

.psg{border-left:2px solid var(--border);padding:3px 0 3px 14px;margin:13px 0;font-size:13px;color:var(--text-2);transition:border-color .3s}
.psg .meta{font:11.5px var(--font-mono);color:var(--text-3);margin-bottom:4px;transition:color .3s}
.psg.hit{border-left-color:var(--accent)}
.psg.hit .meta{color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  .trace i{animation:none;width:100%;opacity:.4}
  .stage.show{animation:none}
  .metric .fill{transition:none}
  .gauge-ring{transition:none}
  .skip-link{transition:none}
}

/* ============ footer ============ */
.site-footer{max-width:1280px;margin:0 auto;padding:0 24px 48px;color:var(--text-3);font-size:12.5px;display:flex;gap:18px;flex-wrap:wrap}
.site-footer a{color:var(--text-2);text-decoration:none;border-bottom:1px solid var(--border);transition:color var(--t),border-color var(--t)}
.site-footer a:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#main" aria-label="RAG Trustworthiness">
      <svg class="brand-mark" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="20" height="20" rx="5" stroke="#2a313a" stroke-width="1.4"/>
        <path d="M4.5 14.5 L8 14.5 L10 7 L12.3 16.2 L14.2 10.5 L16 13 L18 13"
              stroke="#4da3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="brand-name">RAG Trustworthiness</span>
    </a>
    <div class="status-cluster">
      <span class="chip"><span class="dot" id="dot"></span><span id="svc">connecting</span></span>
      <span class="chip">passages <b id="npsg" class="mono">—</b></span>
      <span class="chip">nli <b id="nli">—</b></span>
      <button class="chip chip-toggle" id="evalToggle" type="button" aria-expanded="false" aria-controls="evalPanel">
        <span>Evaluation</span><span class="chevron" id="evalToggleIcon" aria-hidden="true">▾</span>
      </button>
    </div>
  </div>
</header>

<main class="workspace" id="main">
  <section class="composer" aria-label="Ask a question">
    <p class="composer-tagline">Every answer returns its evidence and a measurement of how well that evidence supports it.</p>

    <div class="composer-row corpus-row">
      <label for="corpusSel" class="sr-only">Corpus</label>
      <select id="corpusSel" class="select" aria-label="corpus"></select>
      <div class="dropzone" id="drop" role="button" tabindex="0" aria-label="Upload a document">drop a document, or click to browse</div>
      <input type="file" id="file" accept=".pdf,.md,.txt" style="display:none">
      <button class="btn-ghost" id="delCorpus" type="button" style="display:none">delete corpus</button>
    </div>

    <div class="scan inline-scan" id="uploadScan" aria-live="polite">
      <div class="steps"><span class="step active" id="uploadLabel"></span></div>
      <div class="trace"><i></i></div>
    </div>
    <div id="uploadMsg"></div>

    <div class="composer-row ask-row">
      <label for="q" class="sr-only">Question</label>
      <input id="q" class="ask-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask something the corpus covers — or something it does not.">
      <button class="btn-primary" id="go" type="button">Measure</button>
    </div>
    <div class="examples" id="ex"></div>
  </section>

  <section class="scan" id="scan" aria-live="polite">
    <div class="steps">
      <span class="step">retrieve</span>
      <span class="step">gate</span>
      <span class="step">generate</span>
      <span class="step">decompose</span>
      <span class="step">entail</span>
      <span class="step">score</span>
    </div>
    <div class="trace"><i></i></div>
  </section>

  <section class="stage" id="stage"></section>

  <section class="card" id="evalPanel" style="display:none;margin-top:22px">
    <h2>Evaluation</h2>
    <div id="evalBody"></div>
  </section>
</main>

<footer class="site-footer">
  <a href="https://github.com/hharsha98/rag-trustworthiness-industrial">Source</a>
  <a href="https://github.com/hharsha98/rag-trustworthiness-industrial/blob/main/METRICS.md">Formal spec</a>
  <span id="foot"></span>
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f3 = x => (x === null || x === undefined || Number.isNaN(x)) ? null : Number(x).toFixed(3);

const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
// Count-up used for the gauge's center number, its legend values and each
// metric bar's number -- the page's one signature motion moment (staged scan
// -> arc draw -> numbers landing on their value). Anything static (e.g. "—"
// for a null/undefined value) is written directly by the caller and never
// passed in here.
function animateNumber(el, target, decimals){
  if (!el || target === null || target === undefined || Number.isNaN(target)) return;
  const final = target.toFixed(decimals);
  if (reduceMotion){ el.textContent = final; return; }
  const duration = 700, start = performance.now();
  (function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = (target * eased).toFixed(decimals);
    if (p < 1) requestAnimationFrame(tick); else el.textContent = final;
  })(start);
}

const META = {
  faithfulness:      ["Faithfulness",       "share of the answer the passages actually entail"],
  attribution:       ["Attribution",        "do the citations point at the right passage"],
  relevance:         ["Context relevance",  "did retrieval find material related to the question"],
  answer_relevance:  ["Answer relevance",   "does the answer address the question asked"],
  conciseness:       ["Conciseness",        "redundancy among the answer's own claims"],
  contradiction_rate:["Contradiction (κ)",  "claims the passages actively refute"],
};
const ORDER = ["faithfulness","attribution","relevance","answer_relevance","conciseness","contradiction_rate"];
const tone = (k,v) => k === "contradiction_rate"
  ? (v > .5 ? "var(--bad)" : v > .25 ? "var(--warn)" : "var(--ok)")
  : (v >= .7 ? "var(--ok)" : v >= .4 ? "var(--warn)" : "var(--bad)");

const fmtMs = x => (x === null || x === undefined || Number.isNaN(Number(x))) ? "—" : Math.round(Number(x)) + "ms";
const fmtPct = x => (x === null || x === undefined || Number.isNaN(Number(x))) ? "—" : Math.round(Number(x) * 100) + "%";
const fmtTrust = x => (x === null || x === undefined || Number.isNaN(Number(x))) ? "—" : Number(x).toFixed(3);

// Compact per-run cost readout, rendered next to the trust gauge (or, for an
// abstention, next to the verdict that replaces it) so a single run's cost is
// visible without opening the Evaluation panel below. Reads `stage_timings`
// straight off the /answer response.
function stageChipsHtml(stages){
  const inner = (Array.isArray(stages) && stages.length)
    ? stages.map(s => `<span class="chip">${esc(s.stage)} <b class="mono">${fmtMs(s.ms)}</b></span>`).join("")
    : "";
  return `<div id="runStages" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px">${inner}</div>`;
}

function gauge(arith, geom){
  const R = 52, SW = 11, R2 = R - SW - 3;
  const C = 2 * Math.PI * R, C2 = 2 * Math.PI * R2;
  const clamp = v => Math.max(0, Math.min(1, Number(v) || 0));
  const gap = (Number(arith) || 0) - (Number(geom) || 0);
  const haveA = arith !== null && arith !== undefined, haveG = geom !== null && geom !== undefined;
  const offA = C * (1 - clamp(arith)), offG = C2 * (1 - clamp(geom));
  return `
  <div class="gauge">
    <svg width="132" height="132" viewBox="0 0 132 132" role="img"
         aria-label="Trust: geometric ${f3(geom) ?? "unavailable"}, arithmetic ${f3(arith) ?? "unavailable"}">
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="#0e1013" stroke-width="${SW}"/>
      <circle class="gauge-ring" cx="66" cy="66" r="${R}" fill="none" stroke="#2a313a" stroke-width="${SW}"
              stroke-linecap="round" stroke-dasharray="${C} ${C}" stroke-dashoffset="${C}" data-off="${offA}"
              transform="rotate(-90 66 66)"/>
      <circle cx="66" cy="66" r="${R2}" fill="none" stroke="#0e1013" stroke-width="${SW}"/>
      <circle class="gauge-ring" cx="66" cy="66" r="${R2}" fill="none" stroke="${tone('t', geom)}" stroke-width="${SW}"
              stroke-linecap="round" stroke-dasharray="${C2} ${C2}" stroke-dashoffset="${C2}" data-off="${offG}"
              transform="rotate(-90 66 66)"/>
      <text x="66" y="61" text-anchor="middle" fill="#f2f4f7" style="font:600 24px var(--font-mono)"
            data-target="${haveG ? geom : ""}">${haveG ? "0.000" : "—"}</text>
      <text x="66" y="80" text-anchor="middle" fill="#7f8a97" style="font:500 9.5px var(--font-mono);letter-spacing:.14em">TRUST</text>
    </svg>
    <div class="legend">
      <div class="row"><span class="swatch" style="background:${tone('t',geom)}"></span>
        Geometric <span class="val" data-target="${haveG ? geom : ""}">${haveG ? "0.000" : "—"}</span></div>
      <div class="row"><span class="swatch" style="background:#2a313a"></span>
        Arithmetic <span class="val" data-target="${haveA ? arith : ""}">${haveA ? "0.000" : "—"}</span></div>
      <div class="collapse-note">${gap > 0.04
        ? `The geometric score sits <b>${gap.toFixed(3)} lower</b>. It is non-compensatory — one weak dimension pulls it down, where the arithmetic mean lets the others mask it.`
        : `Both aggregates agree, so no single dimension is dragging. The geometric form can never exceed the arithmetic one.`}</div>
    </div>
  </div>`;
}

function metricRow(k, v){
  const [name, hint] = META[k] || [k, ""];
  if (v === null || v === undefined) {
    return `<div class="metric"><div class="lab"><span class="name">${name}</span>
      <span class="num na">undefined</span></div><div class="track"></div>
      <div class="hint">not computable for this answer — dropped from the score, not counted as zero</div></div>`;
  }
  return `<div class="metric">
    <div class="lab"><span class="name">${name}</span><span class="num" style="color:${tone(k,v)}" data-target="${v}">0.000</span></div>
    <div class="track"><i class="fill" style="background:${tone(k,v)}" data-w="${Math.max(0,Math.min(1,v))*100}"></i></div>
    <div class="hint">${hint}</div></div>`;
}

const linkCites = t => esc(t).replace(/\[(\d+)\]/g, (_, n) => `<span class="cite" data-p="${n}" role="button" tabindex="0">[${n}]</span>`);

let scanTimer = null;
function startScan(){
  const steps = [...document.querySelectorAll(".scan .step")];
  steps.forEach(s => s.className = "step");
  $("#scan").classList.add("show");
  $("#stage").classList.remove("show");
  let i = 0;
  (function tick(){
    if (i > 0) steps[i-1].className = "step done";
    if (i < steps.length) steps[i].className = "step active";
    i++;
    if (i <= steps.length) scanTimer = setTimeout(tick, 620);
  })();
}
const stopScan = () => { clearTimeout(scanTimer); $("#scan").classList.remove("show"); };

function render(d){
  const m = d.metrics || {}, t = d.trust || {};
  let h = "";

  if (d.abstained){
    h += `<div class="verdict abst"><div>
      <div class="big">Declined to answer</div>
      <div class="sub">${esc(d.abstain_reason || "Nothing in the corpus supports an answer.")}</div>
    </div></div>
    <div class="card"><h2>Why this is the correct outcome</h2>
    <p style="margin:0;color:var(--text-2);font-size:13.5px;line-height:1.7">
    The retrieval gate fires <em>before</em> generation, so a question the corpus cannot answer costs
    nothing to refuse. Declining is a first-class result here — a system that always answers has no
    way to tell you when it should not have.</p>${stageChipsHtml(d.stage_timings)}</div>`;
  } else {
    const ok = d.is_trustworthy;
    h += `<div class="verdict ${ok ? "ok" : "no"}"><div>
      <div class="big">${ok ? "Answer met the trust threshold" : "Answer fell below the trust threshold"}</div>
      <div class="sub">${ok
        ? "Grounding, citation accuracy and relevance all cleared their bars."
        : "At least one dimension is weak enough to pull the non-compensatory score down."}</div>
    </div></div>`;

    h += `<div class="cols"><div>
      <div class="card"><h2>Answer</h2><div class="answer">${linkCites(d.answer)}</div></div>`;

    // Support scores arrive at the TOP level as `per_claim_support`, and the
    // claim -> passage mapping as `citations` ({claimIndex: passageIndex}), not
    // inside `metrics`. Read them from where the API actually puts them.
    const support = d.per_claim_support || [];
    const cites = d.citations || {};
    if (d.claims && d.claims.length){
      h += `<div class="card" style="margin-top:18px"><h2>Per-claim grounding</h2><div class="tblwrap">
        <table><thead><tr><th>Claim</th><th style="text-align:right">Support</th><th style="text-align:right">Cites</th></tr></thead><tbody>` +
        d.claims.map((c,i) => {
          const s = support[i];
          const p = cites[String(i)];
          return `<tr><td>${esc(c)}</td>
            <td class="n" style="color:${s === undefined ? "var(--text-3)" : tone('faithfulness', s)}">${f3(s) ?? "—"}</td>
            <td class="n" style="color:var(--text-3)">${p === undefined ? "—" : "#" + (p + 1)}</td></tr>`;
        }).join("") + `</tbody></table>
        <p class="hint" style="margin:10px 0 0;font-size:11.5px;color:var(--text-3)">
        Support is the best entailment probability across retrieved passages. A claim can be
        well-supported yet uncited — that gap is exactly what attribution measures.</p>
        </div></div>`;
    }
    h += `</div><div>
      <div class="card">${gauge(t.arithmetic, t.geometric)}${stageChipsHtml(d.stage_timings)}</div>
      <div class="card" style="margin-top:18px"><h2>Metrics</h2>${
        ORDER.filter(k => k in m).map(k => metricRow(k, m[k])).join("")}</div>
      </div></div>`;
  }

  const ps = d.passages || [];
  if (ps.length){
    h += `<div class="card" style="margin-top:18px"><h2>Retrieved passages</h2>` +
      ps.map((p,i) => {
        let src = "";
        if (p.source && p.source.source){
          src = esc(p.source.source);
          if (p.source.page !== undefined && p.source.page !== null && p.source.page !== ""){
            src += " p." + esc(String(p.source.page));
          }
        }
        return `<div class="psg" id="p${i+1}">
        <div class="meta">#${p.rank ?? i+1}${src ? " · " + src : ""} · ${scoreLabel} ${f3(p.score) ?? "—"}</div>${esc(p.text)}</div>`;
      }).join("") +
      `</div>`;
  }

  $("#stage").innerHTML = h;
  $("#stage").classList.add("show");
  requestAnimationFrame(() => {
    document.querySelectorAll(".fill").forEach(el => { el.style.width = el.dataset.w + "%"; });
    document.querySelectorAll(".gauge-ring").forEach(el => { el.style.strokeDashoffset = el.dataset.off; });
    document.querySelectorAll("[data-target]").forEach(el => {
      const raw = el.dataset.target;
      if (raw === "" || raw === undefined) return;
      animateNumber(el, Number(raw), 3);
    });
  });
  const jump = c => {
    const el = document.getElementById("p" + c.dataset.p);
    if (el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("hit");
             setTimeout(() => el.classList.remove("hit"), 2200); }
  };
  document.querySelectorAll(".cite").forEach(c => {
    c.onclick = () => jump(c);
    c.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); jump(c); } };
  });
}

const STAGE_ORDER = ["retrieve","gate","generate","decompose","entail","score"];

function renderEvalPanel(data){
  const stats = (data && data.stats) || {};
  const traces = Array.isArray(data && data.traces) ? data.traces : [];
  const body = $("#evalBody");

  if (!stats.count){
    body.innerHTML = `<p style="margin:0;color:var(--text-3);font-size:13px">no runs recorded yet — ask a question to populate this panel.</p>`;
    return;
  }

  let h = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
    <span class="chip">runs <b class="mono">${stats.count}</b></span>
    <span class="chip">abstention <b class="mono">${fmtPct(stats.abstention_rate)}</b></span>
    <span class="chip">p50 <b class="mono">${fmtMs(stats.p50_ms)}</b></span>
    <span class="chip">p95 <b class="mono">${fmtMs(stats.p95_ms)}</b></span>
    <span class="chip">mean trust <b class="mono">${fmtTrust(stats.mean_trust)}</b></span>
  </div>`;

  // Latency breakdown: mean ms per stage across the traces this call returned
  // (not the full ring buffer) -- the payoff of the panel, showing where the
  // time actually goes. Bars scale to the largest stage mean, matching the
  // .fill pattern used for the per-metric bars above.
  const sums = {}, counts = {};
  traces.forEach(t => (t.stages || []).forEach(s => {
    sums[s.stage] = (sums[s.stage] || 0) + (Number(s.ms) || 0);
    counts[s.stage] = (counts[s.stage] || 0) + 1;
  }));
  const means = STAGE_ORDER.filter(k => counts[k]).map(k => ({stage: k, mean: sums[k] / counts[k]}));
  if (means.length){
    const maxMean = Math.max(...means.map(m => m.mean), 0.001);
    h += `<div style="margin-bottom:20px">` + means.map(m => `
      <div class="metric">
        <div class="lab"><span class="name">${esc(m.stage)}</span><span class="num">${fmtMs(m.mean)}</span></div>
        <div class="track"><i class="fill" style="background:var(--accent)" data-w="${(m.mean / maxMean * 100).toFixed(1)}"></i></div>
      </div>`).join("") + `</div>`;
  }

  // Recent runs -- TraceBuffer.recent() already returns newest-first, capped
  // here at 15 with its own scroll region so the page doesn't grow unbounded.
  const rows = traces.slice(0, 15);
  h += `<div class="tblwrap" style="max-height:320px;overflow-y:auto">
    <table><thead><tr>
      <th>Question</th><th>Corpus</th><th>Result</th>
      <th style="text-align:right">Trust</th><th style="text-align:right">Total</th>
    </tr></thead><tbody>` +
    rows.map(t => `<tr>
      <td style="font:12.5px var(--font-mono);color:var(--text-2)">${esc(t.question_hash)}</td>
      <td style="color:var(--text-3);font-size:12.5px">${t.corpus_id ? esc(t.corpus_id) : "demo"}</td>
      <td>${t.abstained
        ? `<span style="color:var(--warn)">abstained</span>`
        : `<span style="color:var(--ok)">answered</span>`}</td>
      <td class="n">${fmtTrust(t.trust_geometric)}</td>
      <td class="n">${fmtMs(t.total_ms)}</td>
    </tr>`).join("") +
    `</tbody></table></div>`;

  body.innerHTML = h;
  requestAnimationFrame(() => body.querySelectorAll(".fill").forEach(el => el.style.width = el.dataset.w + "%"));
}

let evalOpen = false;
function loadEval(){
  $("#evalBody").innerHTML = `<p style="margin:0;color:var(--text-3);font-size:13px">loading…</p>`;
  fetch("/traces?limit=50").then(r => r.json()).then(renderEvalPanel).catch(() => {
    $("#evalBody").innerHTML = `<p class="err" style="margin:0;padding:0">failed to load evaluation data</p>`;
  });
}
$("#evalToggle").onclick = () => {
  evalOpen = !evalOpen;
  $("#evalPanel").style.display = evalOpen ? "" : "none";
  $("#evalToggleIcon").textContent = evalOpen ? "▴" : "▾";
  $("#evalToggle").setAttribute("aria-expanded", String(evalOpen));
  if (evalOpen) loadEval();
};

// What `p.score` actually IS depends on retrieval_mode, and the three are not
// the same quantity on the same scale: dense returns a cosine similarity in
// [0,1], sparse returns an unbounded BM25 score, and hybrid returns a
// Reciprocal Rank Fusion score that is roughly 1/(60+rank) -- around 0.03 at
// rank 1, which reads as "almost no match" if you label it "similarity".
// Calling all three "similarity" would misreport the measurement, which is the
// one thing this page must never do. (The abstention gate is unaffected: see
// pipeline.py, which recomputes cosine explicitly rather than gating on this.)
const SCORE_LABELS = {hybrid: "rrf", dense: "cosine", sparse: "bm25"};
let scoreLabel = "score";
fetch("/config").then(r => r.json())
  .then(c => { scoreLabel = SCORE_LABELS[c.retrieval_mode] || "score"; })
  .catch(() => {});

let corpora = [];
let currentCorpus = null;
let demoPassages = null;
const corpusSel = $("#corpusSel");

function optionsHtml(){
  return `<option value="">demo corpus</option>` +
    corpora.map(c => `<option value="${esc(c.corpus_id)}"${c.corpus_id === currentCorpus ? " selected" : ""}>${esc(c.filename)} · ${c.passages}p</option>`).join("");
}

function loadCorpora(){
  return fetch("/corpora").then(r => r.json()).then(list => {
    corpora = Array.isArray(list) ? list : [];
    if (currentCorpus && !corpora.some(c => c.corpus_id === currentCorpus)) currentCorpus = null;
    corpusSel.innerHTML = optionsHtml();
    corpusSel.value = currentCorpus || "";
    $("#delCorpus").style.display = currentCorpus ? "" : "none";
  }).catch(() => {});
}

corpusSel.onchange = () => {
  currentCorpus = corpusSel.value || null;
  $("#delCorpus").style.display = currentCorpus ? "" : "none";
  if (currentCorpus){
    const c = corpora.find(x => x.corpus_id === currentCorpus);
    $("#npsg").textContent = c ? c.passages : "—";
  } else {
    $("#npsg").textContent = demoPassages ?? "—";
  }
};

$("#delCorpus").onclick = async () => {
  if (!currentCorpus) return;
  const id = currentCorpus;
  $("#delCorpus").disabled = true;
  try{
    const r = await fetch("/corpora/" + encodeURIComponent(id), {method:"DELETE"});
    if (r.ok){
      currentCorpus = null;
      await loadCorpora();
      $("#npsg").textContent = demoPassages ?? "—";
      // The "Indexed <file> — N passages" line refers to a corpus that no
      // longer exists; leaving it up contradicts the selector next to it.
      clearUploadMsg();
    }
  }catch(e){}
  finally{ $("#delCorpus").disabled = false; }
};

function showUploadMsg(html){
  const el = $("#uploadMsg");
  el.className = "confirm";
  el.innerHTML = html;
}
function showUploadErr(detail){
  const el = $("#uploadMsg");
  el.className = "err";
  el.innerHTML = esc(detail);
}
function clearUploadMsg(){
  const el = $("#uploadMsg");
  el.className = "";
  el.innerHTML = "";
}

async function uploadFile(file){
  clearUploadMsg();
  $("#go").disabled = true;
  $("#uploadLabel").textContent = "indexing " + file.name;
  $("#uploadScan").classList.add("show");
  const fd = new FormData();
  fd.append("file", file);
  try{
    const r = await fetch("/corpora", {method:"POST", body: fd});
    const d = await r.json().catch(() => ({}));
    $("#uploadScan").classList.remove("show");
    if (!r.ok){
      showUploadErr(d.detail || ("HTTP " + r.status));
      return;
    }
    currentCorpus = d.corpus_id;
    await loadCorpora();
    $("#npsg").textContent = d.passages ?? "—";
    showUploadMsg(`Indexed <b>${esc(d.filename)}</b> — ${d.passages} passages`);
  }catch(e){
    $("#uploadScan").classList.remove("show");
    showUploadErr("Upload failed — " + e.message);
  }finally{
    $("#go").disabled = false;
  }
}

const dropZone = $("#drop"), fileInput = $("#file");
dropZone.onclick = () => fileInput.click();
dropZone.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); fileInput.click(); }
});
fileInput.onchange = () => {
  if (fileInput.files[0]) uploadFile(fileInput.files[0]);
  fileInput.value = "";
};
["dragover","dragenter"].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.add("drag");
}));
["dragleave","drop"].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); dropZone.classList.remove("drag");
}));
dropZone.addEventListener("drop", e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) uploadFile(f);
});

async function ask(q){
  if (!q || !q.trim()) return;
  $("#go").disabled = true; startScan();
  try{
    const body = {question:q};
    if (currentCorpus) body.corpus_id = currentCorpus;
    const r = await fetch("/answer", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    stopScan();
    if (!r.ok){
      if (r.status === 404){
        $("#stage").innerHTML = `<div class="err">Corpus no longer available — reset to demo corpus.</div>`;
        $("#stage").classList.add("show");
        currentCorpus = null;
        await loadCorpora();
        $("#npsg").textContent = demoPassages ?? "—";
      } else {
        $("#stage").innerHTML = `<div class="err">${esc(d.detail || ("HTTP " + r.status))}</div>`;
        $("#stage").classList.add("show");
      }
    } else {
      render(d);
      if (evalOpen) loadEval();
    }
  }catch(e){
    stopScan();
    $("#stage").innerHTML = `<div class="err">Request failed — ${esc(e.message)}</div>`;
    $("#stage").classList.add("show");
  }finally{ $("#go").disabled = false; }
}

$("#go").onclick = () => ask($("#q").value);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") ask($("#q").value); });

fetch("/health").then(r => r.json()).then(d => {
  $("#dot").className = "dot on"; $("#svc").textContent = "online";
  demoPassages = d.passages ?? null;
  $("#npsg").textContent = d.passages ?? "—";
  $("#nli").textContent = (d.nli_model || "—").split("/").pop();
}).catch(() => { $("#dot").className = "dot off"; $("#svc").textContent = "offline"; });

loadCorpora();

fetch("/api/examples").then(r => r.json()).then(list => {
  if (!Array.isArray(list) || !list.length) return;
  const inC = list.filter(x => x.category === "pdf").slice(0, 3);
  const out = list.filter(x => x.category !== "pdf").slice(0, 2);
  $("#ex").innerHTML = [...inC, ...out].map(x =>
    `<button class="ex" data-kind="${x.category === "pdf" ? "in" : "out"}">${esc(x.question)}</button>`).join("");
  // Scoped to #ex, NOT document-wide: the delete-corpus button reuses the .ex
  // class for its styling, and this runs after page load, so a document-wide
  // selector would overwrite that button's own click handler -- clicking
  // "delete corpus" would silently ask "delete corpus" as a question instead.
  $("#ex").querySelectorAll(".ex").forEach(b => b.onclick = () => { $("#q").value = b.textContent; ask(b.textContent); });
}).catch(() => {});

$("#foot").textContent = "Answers are deterministic — the same question returns the same score.";
</script>
</body>
</html>

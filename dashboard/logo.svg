<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="rtTitle rtDesc">
  <title id="rtTitle">RAG Trust  Citation Seal</title>
  <desc id="rtDesc">Octagonal calibration plate with a gauge arc and citation brackets around a grounded pip. Not a triangle.</desc>
  <!-- Industrial inspection plate -->
  <path d="M11 2.6h10L29.4 11v10L21 29.4H11L2.6 21V11L11 2.6z"
        fill="#0b0d10" stroke="#8eb6dc" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Instrument well -->
  <circle cx="16" cy="16" r="10.15" fill="#07090c"/>
  <!-- Gauge track -->
  <circle cx="16" cy="16" r="8.35" stroke="#2c3640" stroke-width="1.3" fill="none"/>
  <!-- Precision ticks (12) -->
  <g stroke="#5d7388" stroke-width="0.7" stroke-linecap="round">
    <path d="M16 6.55v1.55"/>
    <path d="M16 23.9v1.55"/>
    <path d="M6.55 16h1.55"/>
    <path d="M23.9 16h1.55"/>
    <path d="M9.28 9.28l1.1 1.1"/>
    <path d="M21.62 21.62l1.1 1.1"/>
    <path d="M22.72 9.28l-1.1 1.1"/>
    <path d="M10.38 21.62l-1.1 1.1"/>
  </g>
  <!-- Measured arc  the trust reading -->
  <path d="M16 7.65 A8.35 8.35 0 1 1 8.05 20.15"
        stroke="#4da3ff" stroke-width="1.75" stroke-linecap="round" fill="none"/>
  <!-- Citation brackets [ ] -->
  <path d="M13.2 11.45 H11.25 V20.55 H13.2"
        stroke="#eef2f6" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M18.8 11.45 H20.75 V20.55 H18.8"
        stroke="#eef2f6" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Grounded evidence pip -->
  <circle cx="16" cy="16" r="1.55" fill="#3ee0c0"/>
</svg>

# Full self-hosted paper stack: Ollama (open-weight generator) + the ragtrust app.
# Run from the repo root with:  docker compose -f docker/docker-compose.yml up
services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "7860:7860"
    environment:
      RAGTRUST_GENERATOR: ollama
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  ollama_models:

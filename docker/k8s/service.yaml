# ClusterIP service fronting the ragtrust-app Deployment (docker/k8s/deployment.yaml).
apiVersion: v1
kind: Service
metadata:
  name: ragtrust-app
  labels:
    app: ragtrust
spec:
  type: ClusterIP
  selector:
    app: ragtrust
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
